name: Generate Space Shooter

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: czl9707/gh-space-shooter@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: game.gif
